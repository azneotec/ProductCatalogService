spring.application.name=ProductCatalogService

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Datasource comes from environment variables; the defaults are the local-dev MySQL.
# Real (e.g. RDS) values must only ever be supplied via DB_URL / DB_USERNAME / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/product_catalog_service}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
server.port=8080

# This DB already has tables from Hibernate's old ddl-auto=update; baseline it at V1
# so Flyway treats that schema as the starting point instead of trying to recreate it.
# Fresh databases (new envs, CI) have nothing to baseline and just run V1, V2, ... in full.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Seed an empty catalog from FakeStore on startup (see seed/FakeStoreSeeder).
catalog.seed.enabled=true
catalog.seed.fakestore.base-url=https://fakestoreapi.com

# Largest page size accepted from clients (e.g. GET /products/search?size=).
spring.data.web.pageable.max-page-size=100

# Product search backend (see search/IProductSearchService). The in-memory Lucene
# index is rebuilt from the DB on every start; a persistent engine can turn that off.
catalog.search.engine=lucene
catalog.search.reindex-on-startup=true
