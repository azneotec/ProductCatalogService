# Active via @ActiveProfiles("test"). Layered on top of main's application.properties,
# so only the datasource is overridden. Literal values here win over main's ${DB_*}
# placeholders, so tests never reach the RDS instance even if DB_* are set in the shell.
spring.datasource.url=jdbc:mysql://localhost:3306/product_catalog_service
spring.datasource.username=root
spring.datasource.password=password
